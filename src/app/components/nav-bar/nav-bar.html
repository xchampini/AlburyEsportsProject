<nav class="navbar">
  <div class="nav-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()">Albury Esports & Gaming</a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Toggle navigation menu">
      ☰
    </button>

    <ul class="navbar-links" [class.open]="isMenuOpen()">
      @for (route of routes; track route.id) {
        <li>
          <a
            [routerLink]="route.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: route.exactMatch }"
            (click)="closeMenu()"
            >{{ route.label }}</a
          >
        </li>
      }
    </ul>
  </div>
</nav>
