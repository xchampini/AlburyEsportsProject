<nav class="navbar">
  <div class="nav-inner">
    <ul class="navbar-links" [class.open]="isMenuOpen()">
      @for (route of routes; track route.id) {
        <li>
          <a
            [routerLink]="route.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: route.exactMatch }"
            (click)="closeMenu()"
            >{{ route.label }}</a
          >
        </li>
      }
    </ul>
  </div>
</nav>
