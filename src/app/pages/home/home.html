<section class="home-page">
  <div class="hero">
    <h1>Casual local tournaments and community game nights.</h1>
    <p>
      Join Rocket League, Smash Bros, and our annual gaming festival. Everyone is welcome—from
      first-time players to seasoned competitors.
    </p>
    <div class="actions">
      <a routerLink="/events">See Events</a>
      <a class="secondary" routerLink="/about">About the Community</a>
    </div>
  </div>
  <app-swiper-component>
    <ng-template #swiperItem>
      <img ngSrc="event_1.jpg" width="1100" height="825" [priority]="true" />
    </ng-template>

    <ng-template #swiperItem>
      <img ngSrc="event_2.jpg" width="1100" height="825" />
    </ng-template>
    <ng-template #swiperItem>
      <img ngSrc="event_3.jpg" width="1100" height="825" />
    </ng-template>
    <ng-template #swiperItem>
      <img ngSrc="event_4.jpg" width="1100" height="825" />
    </ng-template>
  </app-swiper-component>
</section>
