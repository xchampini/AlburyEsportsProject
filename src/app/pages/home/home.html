<section id="home" class="home-page">
  <div class="hero">
    <h1>Casual local gaming tournaments and community events.</h1>
    <p>
      We bring people together through gaming—whether it's a fun competition, a chill hangout, or an
      exciting Esports event. We create spaces for everyone to play, connect, and grow with fair
      play, good vibes, and opportunities to level up!
    </p>
  </div>
  <app-swiper-component>
    <ng-template #swiperItem>
      <img ngSrc="event_1.jpg" width="1100" height="825" [priority]="true" class="swiper-image" />
    </ng-template>

    <ng-template #swiperItem>
      <img ngSrc="event_2.jpg" width="1100" height="825" class="swiper-image" />
    </ng-template>
    <ng-template #swiperItem>
      <img ngSrc="event_3.jpg" width="1100" height="825" class="swiper-image" />
    </ng-template>
    <ng-template #swiperItem>
      <img ngSrc="event_4.jpg" width="1100" height="825" class="swiper-image" />
    </ng-template>
  </app-swiper-component>
</section>

<section id="about" class="about-page">
  <app-about-us></app-about-us>
</section>

<section id="contact" class="contact-page">
  <app-contact-us></app-contact-us>
</section>
